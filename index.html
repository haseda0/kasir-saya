<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achira Business Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'in': 'fadeIn 0.5s ease-out'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        };
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#FFF9FB] text-slate-900 font-sans">
    <div id="root"></div>

    <!-- Script React & Logic -->
    <script type="module">
        import React, { useState, useEffect, useMemo } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
            LayoutDashboard, Package, ShoppingCart, History, Plus, 
            Search, AlertTriangle, TrendingUp, DollarSign, 
            ArrowUpRight, Users, MessageCircle, X, CheckCircle2,
            Loader2, Trash2, ShieldCheck, ShoppingBasket, Store,
            Wallet
        } from 'https://esm.sh/lucide-react@0.263.1';

        const App = () => {
            // --- State Utama ---
            const [activeTab, setActiveTab] = useState('dashboard');
            const [products, setProducts] = useState([]);
            const [sales, setSales] = useState([]);
            const [customers, setCustomers] = useState([]);
            const [loading, setLoading] = useState(true);
            const [toast, setToast] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');

            // POS State
            const [cart, setCart] = useState([]);
            const [selectedCust, setSelectedCust] = useState({ id: 'umum', name: 'Pelanggan Umum' });
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [discount, setDiscount] = useState(0);

            // Modal Transaksi Berhasil
            const [lastSale, setLastSale] = useState(null);

            // Form Input
            const [prodForm, setProdForm] = useState({ name: '', buyPrice: '', sellPrice: '', stock: '', category: 'Umum' });
            const [custForm, setCustForm] = useState({ name: '', phone: '' });

            // --- LOCAL STORAGE MANAGER ---
            useEffect(() => {
                const loadData = () => {
                    try {
                        const localProd = JSON.parse(localStorage.getItem('achira_products') || '[]');
                        const localSales = JSON.parse(localStorage.getItem('achira_sales') || '[]');
                        const localCust = JSON.parse(localStorage.getItem('achira_customers') || '[]');
                        setProducts(localProd);
                        setSales(localSales);
                        setCustomers(localCust);
                    } catch (e) {
                        console.error("Gagal memuat data lokal", e);
                    } finally {
                        setLoading(false);
                    }
                };
                loadData();
            }, []);

            useEffect(() => localStorage.setItem('achira_products', JSON.stringify(products)), [products]);
            useEffect(() => localStorage.setItem('achira_sales', JSON.stringify(sales)), [sales]);
            useEffect(() => localStorage.setItem('achira_customers', JSON.stringify(customers)), [customers]);

            // --- Fungsi CRUD ---
            const showToast = (type, msg) => {
                setToast({ type, msg });
                setTimeout(() => setToast(null), 3000);
            };

            const addProduct = (e) => {
                e.preventDefault();
                const newProd = { 
                    id: Date.now().toString(), 
                    ...prodForm, 
                    buyPrice: Number(prodForm.buyPrice), 
                    sellPrice: Number(prodForm.sellPrice), 
                    stock: Number(prodForm.stock) 
                };
                setProducts([...products, newProd]);
                setProdForm({ name: '', buyPrice: '', sellPrice: '', stock: '', category: 'Umum' });
                showToast('success', 'Produk Disimpan');
            };

            const deleteProduct = (id) => {
                if(confirm('Hapus produk ini?')) setProducts(products.filter(p => p.id !== id));
            };

            const addCustomer = (e) => {
                e.preventDefault();
                const newCust = { id: Date.now().toString(), ...custForm };
                setCustomers([...customers, newCust]);
                setCustForm({ name: '', phone: '' });
                showToast('success', 'Pelanggan Terdaftar');
            };

            const deleteCustomer = (id) => {
                if(confirm('Hapus pelanggan?')) setCustomers(customers.filter(c => c.id !== id));
            };

            const formatIDR = (n) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n || 0);

            // --- Logika Keranjang POS ---
            const addToCart = (product) => {
                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    if (existing.qty + 1 > product.stock) return showToast('error', 'Stok tidak mencukupi!');
                    setCart(cart.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item));
                } else {
                    if (product.stock < 1) return showToast('error', 'Stok habis!');
                    setCart([...cart, { ...product, qty: 1 }]);
                }
            };

            const removeFromCart = (id) => setCart(cart.filter(item => item.id !== id));

            const totals = useMemo(() => {
                const subtotal = cart.reduce((s, i) => s + (i.sellPrice * i.qty), 0);
                const discAmount = (Number(discount) / 100) * subtotal;
                const grandTotal = subtotal - discAmount;
                return { subtotal, discAmount, grandTotal };
            }, [cart, discount]);

            const processCheckout = () => {
                if (cart.length === 0) return;
                
                const { subtotal, grandTotal, discAmount } = totals;
                const totalCost = cart.reduce((sum, item) => sum + (item.buyPrice * item.qty), 0);
                const profit = grandTotal - totalCost;

                const updatedProducts = products.map(p => {
                    const cartItem = cart.find(c => c.id === p.id);
                    if (cartItem) return { ...p, stock: p.stock - cartItem.qty };
                    return p;
                });
                setProducts(updatedProducts);

                const saleData = {
                    id: Date.now().toString(),
                    items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.sellPrice })),
                    customerName: selectedCust.name,
                    customerPhone: customers.find(c => c.id === selectedCust.id)?.phone || '',
                    subtotal,
                    discount: discAmount,
                    total: grandTotal,
                    profit: profit,
                    date: Date.now()
                };

                setSales([saleData, ...sales]);
                setLastSale(saleData);
                setCart([]); setDiscount(0); setSelectedCust({ id: 'umum', name: 'Pelanggan Umum' });
                setIsCartOpen(false);
                showToast('success', 'Transaksi Berhasil!');
            };

            const sendWAStruk = (s) => {
                let msg = `*ACHIRA - STRUK PEMBAYARAN*\n--------------------------\n`;
                msg += `Tgl: ${new Date(s.date).toLocaleDateString()}\nPlg: ${s.customerName}\n\n`;
                s.items.forEach(i => msg += `• ${i.name} x${i.qty}\n   ${formatIDR(i.qty * i.price)}\n`);
                msg += `\n--------------------------\n`;
                if (s.discount > 0) msg += `Disc: -${formatIDR(s.discount)}\n`;
                msg += `*TOTAL: ${formatIDR(s.total)}*\n\n_Terima kasih telah berbelanja!_`;
                
                const rawPhone = s.customerPhone || '';
                const phone = rawPhone.replace(/\D/g, '');
                const link = `https://wa.me/${phone.startsWith('0') ? '62'+phone.slice(1) : phone}?text=${encodeURIComponent(msg)}`;
                window.open(link, '_blank');
            };

            const stats = useMemo(() => {
                const revenue = sales.reduce((s, a) => s + a.total, 0);
                const profit = sales.reduce((s, a) => s + a.profit, 0);
                return { revenue, net: profit, low: products.filter(p => p.stock <= 5).length };
            }, [sales, products]);

            // --- SUB-RENDER FUNCTIONS (Untuk menghindari Syntax Error) ---

            const renderDashboard = () => React.createElement("div", { className: "animate-in fade-in duration-500 space-y-4" },
                React.createElement("div", { className: "grid grid-cols-2 lg:grid-cols-4 gap-3" },
                    [{ label: 'Omzet', val: stats.revenue, icon: TrendingUp, col: 'text-slate-900' }, { label: 'Profit', val: stats.net, icon: DollarSign, col: 'text-emerald-600' }, { label: 'Stok Kritis', val: `${stats.low} Item`, icon: AlertTriangle, col: 'text-amber-600' }].map((s, idx) => 
                        React.createElement("div", { key: idx, className: "bg-white p-5 rounded-[2.5rem] border border-rose-50/50 shadow-sm flex flex-col justify-between h-32" },
                            React.createElement("div", { className: "bg-rose-50 w-8 h-8 rounded-xl flex items-center justify-center text-rose-500" }, React.createElement(s.icon, { size: 14 })),
                            React.createElement("div", null,
                                React.createElement("p", { className: "text-[9px] font-black text-slate-300 uppercase mb-1 tracking-widest" }, s.label),
                                React.createElement("p", { className: `text-sm font-black truncate ${s.col}` }, typeof s.val === 'number' ? formatIDR(s.val) : s.val)
                            )
                        )
                    )
                ),
                React.createElement("div", { className: "bg-white p-8 rounded-[3rem] border border-rose-50/50 shadow-sm" },
                    React.createElement("h3", { className: "text-[10px] font-black mb-6 uppercase tracking-[0.3em] text-slate-400" }, "Transaksi Terbaru"),
                    React.createElement("div", { className: "space-y-4" },
                        sales.slice(0, 5).map(s => 
                            React.createElement("div", { key: s.id, className: "flex justify-between items-center border-b border-rose-50 last:border-0 pb-3" },
                                React.createElement("div", { className: "min-w-0 pr-4" },
                                    React.createElement("p", { className: "font-bold text-slate-800 text-[11px] leading-none mb-1 truncate uppercase" }, s.customerName),
                                    React.createElement("p", { className: "text-[9px] font-black text-slate-300 uppercase" }, new Date(s.date).toLocaleDateString())
                                ),
                                React.createElement("p", { className: "font-black text-slate-900 text-xs shrink-0" }, formatIDR(s.total))
                            )
                        ),
                        sales.length === 0 && React.createElement("p", { className: "text-center text-slate-200 py-10 text-[10px] font-black uppercase tracking-widest" }, "Belum ada data")
                    )
                )
            );

            const renderPos = () => React.createElement("div", { className: "animate-in zoom-in-95 flex flex-col gap-4" },
                React.createElement("div", { className: "sticky top-[110px] md:top-0 z-40 bg-[#FFF9FB]/90 backdrop-blur-md py-2" },
                    React.createElement("div", { className: "bg-white p-4 rounded-3xl border border-rose-100 flex items-center gap-3 shadow-lg" },
                        React.createElement(Search, { className: "text-rose-300 h-5 w-5 shrink-0" }),
                        React.createElement("input", { placeholder: "Cari barang...", className: "flex-1 font-bold text-xs outline-none bg-transparent", onChange: (e) => setSearchTerm(e.target.value) })
                    )
                ),
                React.createElement("div", { className: "grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3" },
                    products.filter(p => p.name.toLowerCase().includes(searchTerm.toLowerCase())).map(p => 
                        React.createElement("button", { key: p.id, onClick: () => addToCart(p), className: "bg-white p-4 rounded-[2.5rem] border border-rose-50 text-left active:scale-90 transition-all shadow-sm relative overflow-hidden h-36 flex flex-col group" },
                            React.createElement("div", { className: "absolute top-0 left-0 w-full h-1.5 bg-rose-50/50 group-active:bg-rose-500 transition-colors" }),
                            React.createElement("h4", { className: "font-bold text-slate-700 text-[10px] mt-2 mb-3 h-10 overflow-hidden line-clamp-2 uppercase leading-tight tracking-tighter" }, p.name),
                            React.createElement("div", { className: "mt-auto flex justify-between items-center" },
                                React.createElement("p", { className: "font-black text-rose-600 text-[11px]" }, formatIDR(p.sellPrice)),
                                React.createElement("span", { className: `text-[9px] font-black px-2 py-0.5 rounded-lg ${p.stock <= 5 ? 'bg-rose-100 text-rose-600' : 'bg-slate-50 text-slate-400'}` }, p.stock)
                            )
                        )
                    )
                ),
                cart.length > 0 && !isCartOpen && React.createElement("button", { onClick: () => setIsCartOpen(true), className: "fixed bottom-28 left-1/2 -translate-x-1/2 md:hidden z-[120] bg-slate-900 text-white px-10 py-5 rounded-full shadow-[0_20px_50px_rgba(0,0,0,0.4)] flex items-center gap-4 active:scale-95 animate-in slide-in-from-bottom-10 border border-white/10" },
                    React.createElement(ShoppingCart, { className: "h-5 w-5 text-rose-400" }),
                    React.createElement("span", { className: "font-black text-[10px] uppercase tracking-widest" }, cart.length, " Item"),
                    React.createElement("div", { className: "h-5 w-px bg-white/10" }),
                    React.createElement("span", { className: "font-black text-sm" }, formatIDR(totals.grandTotal))
                ),
                React.createElement("div", { className: `fixed inset-0 z-[200] bg-rose-950/70 backdrop-blur-sm md:hidden transition-opacity duration-300 ${isCartOpen ? 'opacity-100' : 'opacity-0 pointer-events-none'}` },
                    React.createElement("div", { className: `absolute bottom-0 left-0 right-0 bg-white rounded-t-[4rem] p-10 pb-16 transition-transform duration-500 transform ${isCartOpen ? 'translate-y-0' : 'translate-y-full'}` },
                        React.createElement("div", { className: "flex items-center justify-between mb-8" },
                            React.createElement("h3", { className: "font-black text-xl uppercase tracking-tighter text-slate-800" }, "Keranjang"),
                            React.createElement("button", { onClick: () => setIsCartOpen(false), className: "bg-rose-50 p-3 rounded-full text-rose-400" }, React.createElement(X, { className: "h-6 w-6" }))
                        ),
                        React.createElement("div", { className: "max-h-[30vh] overflow-y-auto space-y-3 mb-8 pr-2 custom-scrollbar" },
                            cart.map(item => 
                                React.createElement("div", { key: item.id, className: "flex justify-between items-center bg-rose-50/30 p-4 rounded-[2rem] border border-rose-50/50" },
                                    React.createElement("div", { className: "min-w-0 flex-1" },
                                        React.createElement("p", { className: "font-bold text-slate-800 text-[11px] truncate uppercase" }, item.name),
                                        React.createElement("p", { className: "text-[10px] font-black text-rose-500 uppercase" }, item.qty, " x ", formatIDR(item.sellPrice))
                                    ),
                                    React.createElement("button", { onClick: () => removeFromCart(item.id), className: "p-3 text-rose-300" }, React.createElement(Trash2, { className: "h-5 w-5" }))
                                )
                            )
                        ),
                        React.createElement("div", { className: "space-y-6 pt-6 border-t border-rose-50" },
                            React.createElement("div", { className: "grid grid-cols-2 gap-3" },
                                React.createElement("div", { className: "space-y-2" },
                                    React.createElement("label", { className: "text-[9px] font-black text-slate-400 uppercase tracking-widest ml-2" }, "Pelanggan"),
                                    React.createElement("select", { className: "w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl font-bold text-[11px] outline-none uppercase", value: selectedCust.id, onChange: (e) => { const c = customers.find(x => x.id === e.target.value) || { id: 'umum', name: 'Pelanggan Umum' }; setSelectedCust({id: c.id, name: c.name}); } },
                                        React.createElement("option", { value: "umum" }, "UMUM"),
                                        customers.map(c => React.createElement("option", { key: c.id, value: c.id }, c.name))
                                    )
                                ),
                                React.createElement("div", { className: "space-y-2" },
                                    React.createElement("label", { className: "text-[9px] font-black text-slate-400 uppercase tracking-widest ml-2" }, "Diskon %"),
                                    React.createElement("input", { type: "number", value: discount, onChange: (e) => setDiscount(e.target.value), className: "w-full bg-slate-50 border border-slate-100 p-4 rounded-2xl font-bold text-sm outline-none text-center" })
                                )
                            ),
                            React.createElement("button", { onClick: processCheckout, className: "w-full bg-rose-600 text-white font-black py-6 rounded-[2.5rem] shadow-xl active:scale-95 transition-all uppercase tracking-[0.2em] text-[11px]" }, "Bayar")
                        )
                    )
                )
            );

            const renderInventory = () => React.createElement("div", { className: "animate-in fade-in space-y-6" },
                React.createElement("div", { className: "bg-white p-8 rounded-[3rem] border border-rose-50 shadow-sm" },
                    React.createElement("h3", { className: "font-black text-base mb-8 uppercase tracking-tighter text-slate-800" }, "Tambah Barang"),
                    React.createElement("form", { onSubmit: addProduct, className: "space-y-4" },
                        React.createElement("input", { placeholder: "Nama Barang", required: true, className: "w-full bg-rose-50/40 p-4 rounded-2xl font-bold text-[11px] border-none uppercase tracking-widest", value: prodForm.name, onChange: (e) => setProdForm({...prodForm, name: e.target.value}) }),
                        React.createElement("div", { className: "grid grid-cols-3 gap-3" },
                            React.createElement("input", { placeholder: "HPP", required: true, type: "number", className: "bg-rose-50/40 p-4 rounded-2xl font-bold text-[11px]", value: prodForm.buyPrice, onChange: (e) => setProdForm({...prodForm, buyPrice: e.target.value}) }),
                            React.createElement("input", { placeholder: "Jual", required: true, type: "number", className: "bg-rose-50/40 p-4 rounded-2xl font-bold text-[11px]", value: prodForm.sellPrice, onChange: (e) => setProdForm({...prodForm, sellPrice: e.target.value}) }),
                            React.createElement("input", { placeholder: "Stok", required: true, type: "number", className: "bg-rose-50/40 p-4 rounded-2xl font-bold text-[11px]", value: prodForm.stock, onChange: (e) => setProdForm({...prodForm, stock: e.target.value}) })
                        ),
                        React.createElement("button", { className: "w-full bg-rose-600 text-white font-black py-5 rounded-[2rem] shadow-lg active:scale-95 transition-all text-[11px] uppercase tracking-widest" }, "Simpan")
                    )
                ),
                React.createElement("div", { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" },
                    products.map(p => 
                        React.createElement("div", { key: p.id, className: "bg-white p-6 rounded-[2.5rem] border border-rose-50 shadow-sm relative group" },
                            React.createElement("h4", { className: "font-black text-slate-800 text-[11px] mb-5 truncate pr-10 uppercase tracking-tighter" }, p.name),
                            React.createElement("div", { className: "flex justify-between items-end" },
                                React.createElement("div", null,
                                    React.createElement("p", { className: "text-[9px] font-black text-slate-300 uppercase mb-1" }, "Harga Jual"),
                                    React.createElement("p", { className: "font-black text-rose-600 text-base leading-none" }, formatIDR(p.sellPrice))
                                ),
                                React.createElement("span", { className: `text-[10px] font-black px-4 py-2 rounded-2xl ${p.stock <= 5 ? 'bg-rose-100 text-rose-600' : 'bg-slate-50 text-slate-400'}` }, p.stock, " Unit")
                            ),
                            React.createElement("button", { onClick: () => deleteProduct(p.id), className: "absolute top-6 right-6 text-rose-100 hover:text-rose-500 active:scale-95" }, React.createElement(Trash2, { className: "h-5 w-5" }))
                        )
                    )
                )
            );

            const renderCustomers = () => React.createElement("div", { className: "animate-in fade-in space-y-8 max-w-xl mx-auto" },
                React.createElement("div", { className: "bg-white p-8 rounded-[3.5rem] border border-rose-50 shadow-sm" },
                    React.createElement("h3", { className: "text-xs font-black mb-8 uppercase text-slate-800 tracking-[0.2em]" }, "Registrasi Pelanggan"),
                    React.createElement("form", { onSubmit: addCustomer, className: "space-y-4" },
                        React.createElement("input", { placeholder: "Nama", required: true, className: "w-full bg-rose-50/30 p-5 rounded-2xl text-[11px] font-bold border-none uppercase tracking-widest", value: custForm.name, onChange: (e) => setCustForm({...custForm, name: e.target.value}) }),
                        React.createElement("input", { placeholder: "WhatsApp", required: true, className: "w-full bg-rose-50/30 p-5 rounded-2xl text-[11px] font-bold border-none tracking-widest", value: custForm.phone, onChange: (e) => setCustForm({...custForm, phone: e.target.value}) }),
                        React.createElement("button", { className: "w-full bg-rose-600 text-white font-black py-5 rounded-[2.5rem] shadow-lg text-[11px] uppercase tracking-widest active:scale-95" }, "Tambah")
                    )
                ),
                React.createElement("div", { className: "space-y-3 pb-10" },
                    customers.map(c => 
                        React.createElement("div", { key: c.id, className: "bg-white p-6 rounded-[2.5rem] border border-rose-50 flex justify-between items-center px-8 shadow-sm" },
                            React.createElement("div", { className: "flex items-center gap-5" },
                                React.createElement("div", { className: "h-12 w-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center font-black text-sm uppercase" }, c.name.charAt(0)),
                                React.createElement("div", { className: "min-w-0" },
                                    React.createElement("p", { className: "font-bold text-slate-800 text-xs leading-none mb-2 uppercase truncate max-w-[180px]" }, c.name),
                                    React.createElement("p", { className: "text-[10px] font-black text-slate-300 tracking-wider" }, c.phone)
                                )
                            ),
                            React.createElement("button", { onClick: () => deleteCustomer(c.id), className: "text-rose-100 hover:text-rose-600" }, React.createElement(Trash2, { className: "h-5 w-5" }))
                        )
                    )
                )
            );

            const renderHistory = () => React.createElement("div", { className: "animate-in fade-in" },
                React.createElement("div", { className: "bg-white rounded-[3.5rem] shadow-sm border border-rose-50 overflow-hidden min-h-[60vh]" },
                    React.createElement("div", { className: "p-10 bg-rose-50/10 border-b border-rose-50 flex justify-between items-center" },
                        React.createElement("h2", { className: "text-xl font-black text-slate-800 uppercase tracking-tighter leading-none" }, "Log Penjualan"),
                        React.createElement("button", { className: "bg-white p-3.5 rounded-2xl border border-rose-100 text-rose-500 shadow-sm" }, React.createElement(History, { size: 20 }))
                    ),
                    React.createElement("div", { className: "overflow-x-auto" },
                        React.createElement("table", { className: "w-full text-left table-auto min-w-[550px]" },
                            React.createElement("thead", null,
                                React.createElement("tr", { className: "text-[9px] font-black text-slate-300 uppercase tracking-[0.3em] border-b border-rose-50 bg-slate-50/50" },
                                    React.createElement("th", { className: "px-10 py-8" }, "Pelanggan"),
                                    React.createElement("th", { className: "px-10 py-8 text-right" }, "Total"),
                                    React.createElement("th", { className: "px-10 py-8 text-center" }, "Struk")
                                )
                            ),
                            React.createElement("tbody", { className: "divide-y divide-rose-50" },
                                sales.map(s => 
                                    React.createElement("tr", { key: s.id },
                                        React.createElement("td", { className: "px-10 py-8" },
                                            React.createElement("p", { className: "font-black text-slate-800 text-[11px] uppercase" }, s.customerName),
                                            React.createElement("p", { className: "text-[9px] text-slate-300 font-black uppercase" }, new Date(s.date).toLocaleDateString())
                                        ),
                                        React.createElement("td", { className: "px-10 py-8 text-right font-black text-rose-900 text-xs" }, formatIDR(s.total)),
